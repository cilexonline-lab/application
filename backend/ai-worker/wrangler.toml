name = "cilex-ai"
main = "worker.js"
compatibility_date = "2026-01-01"
# Serve all'SDK Anthropic (usa moduli node:).
compatibility_flags = ["nodejs_compat"]

[vars]
# Contenuti ufficiali (club, eventi, consigli, FAQ del team), generati da `npm run build:pages` in cilex/.
CONTENT_URL = "https://cilexonline-lab.github.io/application/content.json"
# Modello: più economico = claude-haiku-5-5 ; più capace = claude-sonnet-5-5
MODEL = "claude-haiku-5-5"

# Per i limiti giornalieri crea un KV e decommenta:
# [[kv_namespaces]]
# binding = "RL"
# id = "INSERIRE_ID_KV"
